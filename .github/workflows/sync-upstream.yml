name: Sync upstream official release

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Find latest upstream official release
        id: upstream
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/Meloong-Git/PCL.git
          git fetch --no-tags upstream main
          line=$(git log upstream/main --format='%H %s' | grep -m 1 -E '^[0-9a-f]+ [0-9]+(\.[0-9]+)+ 正式版$' || true)
          if [ -z "$line" ]; then
            echo "::error::No official release commit found on upstream/main."
            exit 1
          fi
          sha=${line%% *}
          subject=${line#* }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "subject=$subject" >> "$GITHUB_OUTPUT"
          echo "Latest upstream official release: $subject ($sha)"

      - name: Merge upstream release
        id: merge
        run: |
          set -euo pipefail
          sha="${{ steps.upstream.outputs.sha }}"
          if git merge-base --is-ancestor "$sha" HEAD; then
            echo "Already up to date with ${{ steps.upstream.outputs.subject }}."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge --no-edit "$sha"; then
            echo "::error::Merge conflict while syncing ${{ steps.upstream.outputs.subject }}. Resolve manually."
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify local changes survived the merge
        if: steps.merge.outputs.changed == 'true'
        run: |
          set -euo pipefail
          secret='Plain Craft Launcher 2/Modules/ModSecret.vb'
          testpage='Plain Craft Launcher 2/Pages/PageOther/PageOtherTest.xaml.vb'
          # 下载恢复与正式版分支身份
          grep -q 'RestrictMcDownload As Boolean = False' "$secret"
          grep -q 'VersionBranchMain As String = "Official"' "$secret"
          grep -q 'RegFolder As String = "PCL"' "$secret"
          # 本地主题解锁与调色
          grep -q 'LocalUnlockedThemeIds' "$secret"
          grep -q 'SyncLocalUnlockedThemes' "$secret"
          # 中国大陆启动确认
          test -f 'Plain Craft Launcher 2/Modules/ModChinaConsent.vb'
          test -f 'Plain Craft Launcher 2/Controls/MyMsg/MyChinaConsentWindow.xaml'
          test -f 'Plain Craft Launcher 2/Controls/MyMsg/MyChinaConsentWindow.xaml.vb'
          grep -q 'IsMainlandChina()' 'Plain Craft Launcher 2/Application.xaml.vb'
          # Tooltip 样式与滚动淡出
          grep -q 'TooltipLoaded' 'Plain Craft Launcher 2/Application.xaml'
          grep -q 'ShowingTooltips' 'Plain Craft Launcher 2/Application.xaml.vb'
          grep -q 'ShowingTooltips' 'Plain Craft Launcher 2/Controls/MyScrollViewer.vb'
          # 百宝箱
          grep -q 'BtnCave_Click' "$testpage"
          grep -q 'IsCaveEnabled' "$testpage"
          # 剪贴板联机：占位 Return 必须已被删除
          ! grep -q "TODO: 联机复活赛" 'Plain Craft Launcher 2/FormMain.xaml.vb'
          # 联机配置联网不再被开源版判断拦截
          ! grep -q 'VersionBranchMain <> "Official"' 'Plain Craft Launcher 2/Pages/PageLink/PageLinkMain.xaml.vb'
          # 联机入口不得被强制隐藏
          ! grep -q 'ForcedSettings' 'Plain Craft Launcher 2/Pages/PageSetup/Settings.vb'
          grep -q 'SystemForkLinkVisibilityMigrated' 'Plain Craft Launcher 2/Application.xaml.vb'
          ! grep -q "BtnTitleSelect2.Visibility = Visibility.Collapsed" 'Plain Craft Launcher 2/Pages/PageSetup/PageSetupUI.xaml.vb'
          ! grep -q "ItemLink.Visibility = Visibility.Collapsed" 'Plain Craft Launcher 2/Pages/PageSetup/PageSetupUI.xaml.vb'
          # 检查更新入口必须保持移除
          ! grep -q 'BtnAboutUpdate' 'Plain Craft Launcher 2/Pages/PageOther/PageOtherAbout.xaml'
          ! grep -q 'BtnSystemUpdate' 'Plain Craft Launcher 2/Pages/PageSetup/PageSetupSystem.xaml'
          ! grep -q 'EventType.检查更新' 'Plain Craft Launcher 2/Modules/ModEvent.vb'
          # 地区识别必须在后台线程执行
          grep -q 'DetectMainlandByIpCore' 'Plain Craft Launcher 2/Modules/ModChinaConsent.vb'
          grep -q 'Task.Run(Function() DetectMainlandByIpCore())' 'Plain Craft Launcher 2/Modules/ModChinaConsent.vb'
          # 陶瓦联机后端与内嵌 EasyTier
          test -f 'Plain Craft Launcher 2/Modules/ModTaowa.vb'
          test -f 'Plain Craft Launcher 2/Modules/ModTaowaCore.vb'
          test -f 'Plain Craft Launcher 2/Modules/ModTaowaEasyTier.vb'
          test -f 'Plain Craft Launcher 2/Modules/ModTaowaInternal.vb'
          test -f 'Plain Craft Launcher 2/Resources/Taowa/EasyTier/easytier-core.exe'
          grep -q 'Pcl2Taowa.Host("Player")' 'Plain Craft Launcher 2/Pages/PageLink/PageLinkMain.xaml.vb'
          grep -q 'Pcl2Taowa.Join(Code, "Player")' 'Plain Craft Launcher 2/Pages/PageLink/PageLinkMain.xaml.vb'
          grep -q 'ExtractEmbeddedTools' 'Plain Craft Launcher 2/Modules/ModTaowaEasyTier.vb'
          grep -q 'PCL.Taowa.easytier-core.exe' 'Plain Craft Launcher 2/Plain Craft Launcher 2.vbproj'

      - name: Push
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:main

      # 使用 GITHUB_TOKEN 推送不会自动触发 build，需要显式派发
      - name: Trigger build
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main
