name: Build
on:
  push:
    paths:
      - 'Plain Craft Launcher 2/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'Plain Craft Launcher 2/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: windows-latest
    strategy:  
       matrix:  
         configuration: [Debug, Release]

    steps:

    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        submodules: true

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64
    
    - name: Update Help
      run:  |
        Set-Location ..
        git clone https://github.com/LTCatt/PCL2Help.git -b master --single-branch --depth 1
        Set-Location PCL2Help
        Remove-Item -Path *.* -Recurse -Force
        Compress-Archive -Path .\* -DestinationPath .\Help.zip
        Copy-Item -Path .\Help.zip -Destination "${{ GITHUB.WORKSPACE }}\Plain Craft Launcher 2\Resources\Help.zip" -Force
        Set-Location ..
        Remove-Item PCL2Help -Recurse -Force
        Set-Location ${{ GITHUB.WORKSPACE }}


    - name: Replace
      run: |
        (gc "Plain Craft Launcher 2\Modules\ModSecret.vb") -replace 'Public OAuthClientId As String = If(Environment.GetEnvironmentVariable("PCL_MS_CLIENT_ID"), "")', 'Public OAuthClientId As String = If(Environment.GetEnvironmentVariable("PCL_MS_CLIENT_ID"), "${{ secrets.CLIENT_ID }}")' | Out-File "Plain Craft Launcher 2\Modules\ModSecret.vb"
        (gc "Plain Craft Launcher 2\Modules\ModSecret.vb") -replace 'Public CurseForgeAPIKey As String = If(Environment.GetEnvironmentVariable("PCL_CURSEFORGE_API_KEY"), "")', 'Public CurseForgeAPIKey As String = If(Environment.GetEnvironmentVariable("PCL_CURSEFORGE_API_KEY"), "${{ secrets.CURSEFORGE_API_KEY }}")' | Out-File "Plain Craft Launcher 2\Modules\ModSecret.vb"
        (gc "Plain Craft Launcher 2\Modules\Base\ModBase.vb") -replace 'Public Const CommitHash As String = ""', 'Public Const CommitHash As String = "${{ github.sha }}"' | Out-File "Plain Craft Launcher 2\Modules\Base\ModBase.vb"
        
    - name: Restore NuGet Packages
      run: dotnet restore PCLCS\PCLCS.csproj

    - name: Build
      run: msbuild "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj" -p:Configuration=${{ matrix.configuration }}

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.configuration }}
        path: Plain Craft Launcher 2\obj\${{ matrix.configuration }}\Plain Craft Launcher 2.exe

  publish:
    name: Publish to Release
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    concurrency:
      group: publish-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect executables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp "artifacts/Release/Plain Craft Launcher 2.exe" "release/PCL2-Fork.exe"
          cp "artifacts/Debug/Plain Craft Launcher 2.exe" "release/PCL2-Fork-Debug.exe"

      - name: Resolve release version
        id: release
        shell: pwsh
        run: |
          $base = Get-Content "Plain Craft Launcher 2\Modules\Base\ModBase.vb" -Raw
          if ($base -notmatch 'VersionBaseName As String = "([^"]+)"') {
            throw "无法从 ModBase.vb 读取 VersionBaseName"
          }
          $version = $Matches[1]
          if ($base -notmatch 'VersionCode As Integer = (\d+)') {
            throw "无法从 ModBase.vb 读取 VersionCode"
          }
          $versionCode = [int]$Matches[1]
          $rev = (& git rev-list --count HEAD).Trim()
          $tag = "v$version-fork.$rev"
          $name = "$version-fork.$rev"

          # 从官方源码中提取当前版本的更新日志
          $changelog = @()
          $form = Get-Content "Plain Craft Launcher 2\FormMain.xaml.vb" -Raw
          $block = [regex]::Match($form, "(?s)If LastVersion < $versionCode Then(.*?)(?=\r?\n\s*If LastVersion <|\r?\n\s*'整理更新日志)")
          if ($block.Success) {
            foreach ($line in ($block.Groups[1].Value -split "\r?\n")) {
              $entry = [regex]::Match($line, '^\s*FeatureList\.Add\(New KeyValuePair\(Of Integer, String\)\(\d+, "([^"]+)"\)\)')
              if ($entry.Success -and $entry.Groups[1].Value -notmatch '联机') {
                $changelog += "- " + $entry.Groups[1].Value
              }
            }
          }

          $body = @(
            "版本：``$version``",
            "提交：``$env:GITHUB_SHA``",
            "Fork 修订号：``$rev``",
            "",
            "- ``PCL2-Fork.exe``：Release 正式版配置",
            "- ``PCL2-Fork-Debug.exe``：Debug 配置"
          )
          if ($changelog.Count -gt 0) {
            $body += @("", "## 官方更新日志（$version）", "") + $changelog
          }
          $body += @("", "微软登录与 CurseForge 使用构建仓库配置的 ``CLIENT_ID`` / ``CURSEFORGE_API_KEY``，未内置官方密钥。")

          foreach ($pair in @(
            @("version", $version),
            @("rev", $rev),
            @("tag", $tag),
            @("name", $name),
            @("body", ($body -join "`n"))
          )) {
            Add-Content -Path $env:GITHUB_OUTPUT -Value ($pair[0] + "<<" + "PCL_OUTPUT_EOF") -Encoding utf8
            Add-Content -Path $env:GITHUB_OUTPUT -Value $pair[1] -Encoding utf8
            Add-Content -Path $env:GITHUB_OUTPUT -Value "PCL_OUTPUT_EOF" -Encoding utf8
          }
          Write-Output "Release version: $name"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          make_latest: true
          overwrite_files: true
          files: |
            release/PCL2-Fork.exe
            release/PCL2-Fork-Debug.exe
          body: ${{ steps.release.outputs.body }}

      - name: Remove legacy latest release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --yes --cleanup-tag
